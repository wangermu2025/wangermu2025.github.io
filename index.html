<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>每日金句</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Songti SC', 'Noto Serif SC', 'STSong', serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .page-container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 60px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .page-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #c41e3a, #8b0000);
        }

        .date-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .year {
            font-size: 16px;
            color: #999;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .month-day {
            font-size: 72px;
            font-weight: bold;
            color: #1a1a1a;
            line-height: 1;
        }

        .weekday {
            font-size: 18px;
            color: #666;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        .lunar {
            font-size: 14px;
            color: #c41e3a;
            margin-top: 10px;
        }

        .quote-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 0;
        }

        .quote-icon {
            font-size: 48px;
            color: #c41e3a;
            opacity: 0.3;
            margin-bottom: 20px;
        }

        .quote-text {
            font-size: 24px;
            line-height: 1.8;
            color: #2c2c2c;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .quote-author {
            text-align: right;
            font-size: 16px;
            color: #666;
            font-style: italic;
        }

        .quote-author::before {
            content: '—— ';
        }

        .footer {
            margin-top: auto;
            padding-top: 30px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-number {
            font-size: 14px;
            color: #999;
        }

        .day-number .current {
            font-size: 36px;
            color: #c41e3a;
            font-weight: bold;
        }

        .navigate {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: none;
            border: 1px solid #ddd;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            color: #666;
        }

        .nav-btn:hover {
            background: #c41e3a;
            color: white;
            border-color: #c41e3a;
        }

        .today-btn {
            background: #c41e3a;
            color: white;
            border: none;
        }

        .today-btn:hover {
            background: #8b0000;
        }

        @media (max-width: 480px) {
            .page-container {
                padding: 40px 25px;
            }

            .month-day {
                font-size: 56px;
            }

            .quote-text {
                font-size: 20px;
            }
        }
    </style>
</head>

        // 获取农历年份的信息
        function getLunarYearInfo(year) {
            return lunarInfo[year - 1900];
        }

        // 获取闰月月份
        function getLeapMonth(year) {
            return getLunarYearInfo(year) & 0xf;
        }

        // 获取某年某月的天数
        function getLunarMonthDays(year, month) {
            return (getLunarYearInfo(year) & (0x10000 >> month)) ? 30 : 29;
        }

        // 获取闰月的天数
        function getLeapMonthDays(year) {
            if (getLeapMonth(year)) {
                return (getLunarYearInfo(year) & 0x10000) ? 30 : 29;
            }
            return 0;
        }

        // 公历转农历
        function solar2lunar(date) {
            // 计算从1900年1月31日（农历1900年正月初一）到指定日期的天数
            const baseDate = new Date(1900, 0, 31);
            let offset = Math.floor((date - baseDate) / 86400000);

            let lunarYear, lunarMonth, lunarDay, isLeap;
            let temp = 0;
            let i;

            // 计算农历年份
            for (i = 1900; i < 2101 && offset > 0; i++) {
                temp = getLunarYearDays(i);
                offset -= temp;
            }

            if (offset < 0) {
                offset += temp;
                i--;
            }

            lunarYear = i;
            isLeap = false;

            // 计算农历月份
            const leapMonth = getLeapMonth(lunarYear);

            for (i = 1; i < 13 && offset > 0; i++) {
                // 闰月
                if (leapMonth > 0 && i === (leapMonth + 1) && !isLeap) {
                    i--;
                    isLeap = true;
                    temp = getLeapMonthDays(lunarYear);
                } else {
                    temp = getLunarMonthDays(lunarYear, i);
                }

                // 解除闰月
                if (isLeap && i === (leapMonth + 1)) {
                    isLeap = false;
                }

                offset -= temp;
            }

            if (offset === 0 && leapMonth > 0 && i === leapMonth + 1) {
                if (isLeap) {
                    isLeap = false;
                } else {
                    isLeap = true;
                    i--;
                }
            }

            if (offset < 0) {
                offset += temp;
                i--;
            }

            lunarMonth = i;
            lunarDay = offset + 1;

            return {
                year: lunarYear,
                month: lunarMonth,
                day: lunarDay,
                isLeap: isLeap
            };
        }

        // 获取农历年份的总天数
        function getLunarYearDays(year) {
            let sum = 348;
            for (let i = 0x8000; i > 0x8; i >>= 1) {
                sum += (getLunarYearInfo(year) & i) ? 1 : 0;
            }
            return sum + getLeapMonthDays(year);
        }

        // 获取农历日期字符串
        function getLunarDate(date) {
            const lunar = solar2lunar(date);
            let result = '';

            // 添加月份
            if (lunar.isLeap) {
                result += '闰';
            }
            result += lunarMonths[lunar.month - 1];

            // 添加日期
            result += lunarDays[lunar.day - 1];

            return result;
        }

            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);

        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

            updatePage();
        });

        // 初始化
        updatePage();
    </script>
